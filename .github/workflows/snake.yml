name: Generate Snake

on:
  schedule:
    # Runs at 11:55pm UTC every day
    - cron: "55 23 * * *"
  # Allows you to run the workflow manually from the Actions tab
  workflow_dispatch:

# **CRITICAL FIX:** This grants the necessary permission for the action to push the generated SVG to the 'output' branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout the main branch
      - uses: actions/checkout@v3
      
      # Generates the snake SVG and GIF files
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          # Replace 'CSEsubham' with your GitHub username if it were different (but it's correct here)
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif
            dist/snake.svg # This generates the specific file your README uses
        env:
          # Uses the default token provided by GitHub Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 

      # Pushes the generated files from the 'dist' folder to the 'output' branch
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
